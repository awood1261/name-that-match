<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title">
  <title id="title">Two wrestlers grappling in a collar-and-elbow tie-up — proposed artwork</title>
  <defs>
    <g id="wrestler" fill="#fff">
      <!-- Forward-leaning head and neck. -->
      <path d="M141 68c8-10 23-9 32-1 8 7 9 16 7 25l-8 7-6 12-12 1-8-11-11-9 1-15Z"/>
      <!-- Back, broad shoulder and angled torso. -->
      <path d="m132 97 18 5 12 20-12 27-19 11-18 23-26-3-11-15 12-27 20-25Z"/>
      <!-- Upper arm reaches the other wrestler's neck, fingers closed. -->
      <path d="m149 108 14-3 15 14 17 3 8-7 10-1 6 6-1 9-9 8-19 3-20-4-25-13Z"/>
      <!-- Lower arm locks across the opposing elbow. -->
      <path d="m131 133 17-3 21 18 17-1 9-7 12 1 5 7-3 9-16 7-27 1-30-15Z"/>
      <!-- Wide, braced stance: rear boot and forward bent leg. -->
      <path d="m86 162 28 9-18 38-29 23-18 32-2 10 11 7-2 7-37 1-5-7 12-28 19-37 27-34Z"/>
      <path d="m106 171 23-7 11 23-7 30 20 39 18 11 8 11-2 9-38 1-8-11-20-35-10-24-2-20Z"/>
    </g>
  </defs>
  <use href="#wrestler"/>
  <use href="#wrestler" transform="translate(400 0) scale(-1 1)"/>
</svg>
